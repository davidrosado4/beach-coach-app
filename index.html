<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0284c7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Beach Coach">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Beach Coach · Planificador de entrenos</title>
<style>
:root{
  --bg:#f3efe6;--card:#ffffff;--text:#1f2937;--muted:#6b7280;--line:#e7e2d6;
  --primary:#0284c7;--primary-dark:#0369a1;--accent:#f97316;--danger:#dc2626;--ok:#16a34a;
  --radius:16px;--shadow:0 2px 10px rgba(31,41,55,.07);
  /* Espacio bajo los iconos de la barra inferior: respeta el indicador de inicio del iPhone */
  --tabs-pb:max(6px, calc(env(safe-area-inset-bottom) - 12px));
  /* Color de la franja bajo la barra inferior (zona fuera del viewport en iOS PWA) */
  --tabs-tail:#cfe6f5;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--tabs-tail);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;font-size:16px;line-height:1.4}
/* El fondo raíz es azul cielo suave: en iOS PWA el viewport puede quedar más corto que la pantalla y la franja
   sobrante bajo la barra blanca se pinta con este color. La barra degrada hacia él para que no haya corte. */
body.run-mode{background:#0f172a}
/* Layout fijo: el body no hace scroll, lo hace #app. Evita que la barra inferior "flote" en iOS.
   No usar position:fixed en html/body: en iOS (PWA) desplaza el viewport y deja un hueco bajo la barra. */
html,body{height:100%;width:100%;overflow:hidden;overscroll-behavior:none}
/* Franja bajo la barra de estado (hora, batería) para que se lea sobre color */
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:var(--primary);z-index:40}
body.run-mode::before{background:#0f172a}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
h1,h2,h3{margin:0;line-height:1.2}
h2{font-size:1.05rem;font-weight:700;margin:22px 4px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
h2 .t{display:inline-flex;align-items:center;gap:6px}
h2 small{font-weight:500;color:var(--muted);font-size:.8rem}
small{color:var(--muted)}
#app{position:fixed;inset:0;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:calc(12px + env(safe-area-inset-top)) 14px calc(96px + env(safe-area-inset-bottom))}
#app>*{max-width:640px;margin-left:auto;margin-right:auto}
body.run-mode #app{background:#0f172a;padding-bottom:0}

/* Iconos SVG */
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none;stroke-width:2;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.ic.fill{fill:currentColor;stroke:none}

/* Hero */
.hero{background:linear-gradient(135deg,#0ea5e9 0%,#0284c7 55%,#f59e0b 140%);color:#fff;border-radius:22px;padding:22px 20px;box-shadow:0 8px 24px rgba(2,132,199,.25);position:relative;overflow:hidden}
.hero .bgic{position:absolute;right:-14px;bottom:-22px;width:140px;height:140px;opacity:.16;stroke-width:1.2;transform:rotate(-12deg)}
.hero .date{opacity:.9;font-size:.85rem;text-transform:capitalize}
.hero h1{font-size:1.7rem;margin:4px 0 12px}
.hero .stats{display:flex;gap:10px;flex-wrap:wrap;position:relative}
.hero .stat{background:rgba(255,255,255,.18);border-radius:12px;padding:6px 12px;font-size:.85rem;backdrop-filter:blur(4px)}
.hero .stat b{font-size:1.05rem;display:block}

/* Cards */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:10px}
.card.tap{cursor:pointer;transition:transform .08s}
.card.tap:active{transform:scale(.985)}
.card.plan{background:linear-gradient(135deg,#fff7ed,#fff);border:1.5px solid #fed7aa}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.row.top{align-items:flex-start}
.grow{flex:1;min-width:0}
.title{font-weight:700;font-size:1rem}
.sub{color:var(--muted);font-size:.85rem;margin-top:2px}
.empty{text-align:center;color:var(--muted);padding:26px 14px;background:rgba(255,255,255,.55);border:2px dashed var(--line);border-radius:var(--radius);font-size:.92rem}
.empty .ic{width:40px;height:40px;stroke-width:1.5;color:#b8b2a4;margin-bottom:6px}
.progress{height:8px;background:#f1f5f9;border-radius:99px;overflow:hidden;margin:8px 0}
.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--primary),#38bdf8);border-radius:99px;transition:width .3s}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:600;background:#eef2ff;color:#4338ca;margin:2px 4px 2px 0;white-space:nowrap}
.chip.sm{padding:1px 8px;font-size:.7rem}
.chip.all{background:#f1f5f9;color:#475569}
.tag{display:inline-flex;align-items:center;gap:4px;background:#f1f5f9;color:#334155;border-radius:8px;padding:2px 8px;font-size:.74rem;font-weight:600;margin:2px 4px 2px 0}
.tag.phase{color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips .sel{border:2px solid transparent;border-radius:999px;padding:6px 12px;font-size:.82rem;font-weight:600;background:#fff;color:var(--muted);box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.chips .sel.on{border-color:var(--c,var(--primary));color:var(--c,var(--primary));background:color-mix(in srgb,var(--c,var(--primary)) 12%,#fff)}
.chips .sel.sub{padding:4px 10px;font-size:.76rem}
.filters{padding:4px 0 2px;margin:-4px 0 10px}
.filters .chips{overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px;scrollbar-width:none;margin-bottom:4px}
.filters .chips::-webkit-scrollbar{display:none}
.segbar{display:flex;background:#e7e2d6;border-radius:12px;padding:3px;margin-bottom:12px}
.segbar button{flex:1;padding:8px;border-radius:10px;font-weight:700;font-size:.85rem;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.segbar button.on{background:#fff;color:var(--primary);box-shadow:var(--shadow)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:11px 16px;font-weight:700;font-size:.92rem;background:#fff;color:var(--primary);box-shadow:var(--shadow);border:1.5px solid var(--line)}
.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn.accent{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent}
.btn.danger{color:var(--danger);border-color:#fecaca;background:#fff}
.btn.small{padding:7px 12px;font-size:.82rem;border-radius:10px}
.btn.block{width:100%;margin-top:8px}
.btn:active{opacity:.85}
.fab{position:fixed;right:18px;bottom:calc(66px + var(--tabs-pb));z-index:20;background:var(--accent);color:#fff;border-radius:999px;padding:14px 20px;font-weight:800;font-size:1rem;box-shadow:0 8px 22px rgba(249,115,22,.4);display:flex;align-items:center;gap:6px}
@media (min-width:680px){.fab{right:calc(50% - 320px + 18px)}}
.icon-btn{width:34px;height:34px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;background:#f1f5f9;color:#475569;font-size:.85rem}
.icon-btn.del{background:#fee2e2;color:var(--danger)}
.icon-btn.lg{width:40px;height:40px;border-radius:12px}

/* Forms */
label.f{display:block;margin-bottom:12px;font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.02em}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:5px;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:#fafaf7;font-size:1rem;font-weight:500;color:var(--text);text-transform:none;letter-spacing:0}
label.f textarea{min-height:88px;resize:vertical}
label.f input:focus,label.f select:focus,label.f textarea:focus{outline:none;border-color:var(--primary);background:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.seg button{flex:1 1 30%;border:1.5px solid var(--line);border-radius:12px;padding:9px 6px;font-size:.78rem;font-weight:600;background:#fafaf7;color:var(--muted);text-transform:none;letter-spacing:0;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.seg button.on{background:var(--c);color:#fff;border-color:var(--c)}

/* Page head */
.page-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 12px}
.back{color:var(--primary);font-weight:700;font-size:1rem;padding:6px 4px;display:inline-flex;align-items:center;gap:2px}
.head-actions{display:flex;gap:6px}

/* Session blocks */
.block{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden;border-left:6px solid var(--c)}
.block-head{display:flex;align-items:center;gap:10px;padding:12px 14px 8px}
.block-head .bic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c)}
.block-head .bic .ic{width:22px;height:22px}
.block-head h3{font-size:1rem}
.items{padding:0 10px}
.item{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;padding:10px 6px;border-top:1px solid var(--line)}
.item-main{min-width:0;cursor:pointer}
.item-main b{display:block;font-size:.95rem}
.item-side{display:flex;align-items:center;gap:6px}
.item-side input{width:56px;border:1.5px solid var(--line);border-radius:10px;padding:6px 6px;text-align:center;font-weight:700;background:#fafaf7}
.item-side .min{font-size:.75rem;color:var(--muted)}
.item-actions{grid-column:1/-1;display:flex;gap:6px;justify-content:flex-end}
.block-actions{display:flex;gap:8px;padding:10px 14px 14px;flex-wrap:wrap}
.total{display:flex;justify-content:space-between;align-items:center;background:#f0f9ff;color:var(--primary-dark);border-radius:12px;padding:10px 12px;font-weight:600;margin-top:4px}

/* Session list */
.sess{display:flex;gap:12px;align-items:stretch}
.datebox{width:58px;flex:none;background:#f0f9ff;color:var(--primary-dark);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 0}
.datebox b{font-size:1.35rem;line-height:1}
.datebox span{font-size:.7rem;text-transform:uppercase;font-weight:700}
.datebox.past{background:#f1f5f9;color:#64748b}
.datebox.today{background:var(--accent);color:#fff}

/* Semana */
.wk-nav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.wk-nav .lbl{flex:1;text-align:center}
.wk-nav .lbl b{font-size:1.05rem;text-transform:capitalize}
.wk-day{padding:12px 14px}
.wk-day.today{border:2px solid var(--accent)}
.wk-day .dh{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.wk-day .dh b{font-size:1rem}
.wk-day .dh .free{margin-left:auto;font-size:.8rem;color:var(--muted)}
.wk-slot{border-top:1px solid var(--line);padding:10px 0 4px;margin-top:6px}
.wk-slot .tm{font-weight:700;color:var(--primary-dark);font-size:.85rem}
.badge{display:inline-flex;align-items:center;gap:4px;justify-content:center;background:var(--accent);color:#fff;border-radius:999px;font-size:.7rem;font-weight:800;padding:2px 8px;white-space:nowrap}
.badge.ok{background:#dcfce7;color:#15803d}
.badge.todo{background:#fee2e2;color:#b91c1c}
.badge.empty{background:#fef3c7;color:#b45309}

/* Run mode */
.run{background:#0f172a;color:#e2e8f0;margin:calc(-12px - env(safe-area-inset-top)) -14px 0;padding:calc(14px + env(safe-area-inset-top)) 14px calc(30px + env(safe-area-inset-bottom));min-height:100%;max-width:none}
.run>*{max-width:640px;margin-left:auto;margin-right:auto}
.run .page-head .back{color:#7dd3fc}
.run .rhead{padding:8px 4px 16px}
.run .rhead h1{font-size:1.5rem;color:#fff}
.run .rblock{margin-bottom:18px}
.run .rblock h3{color:var(--c);font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;margin:0 4px 8px;display:flex;justify-content:space-between;align-items:center}
.run .rblock h3 span{display:inline-flex;align-items:center;gap:6px}
.run .ritem{background:#1e293b;border-radius:14px;padding:12px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start;border-left:4px solid var(--c)}
.run .ritem.done{opacity:.45}
.run .ritem .chk{width:26px;height:26px;border-radius:8px;border:2px solid #475569;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;margin-top:2px}
.run .ritem.done .chk{background:var(--ok);border-color:var(--ok)}
.run .ritem b{font-size:1.05rem;color:#fff;display:block}
.run .ritem .d{color:#94a3b8;font-size:.9rem;white-space:pre-wrap;margin-top:4px;display:flex;gap:6px;align-items:flex-start}
.run .ritem .d .ic{margin-top:3px;color:#64748b}
.run .ritem .dur{color:var(--c);font-weight:800;font-size:1rem;flex:none}
.run .ritem .side{display:flex;flex-direction:column;align-items:flex-end;flex:none;gap:2px}
.run .ritem .pt{color:#64748b;font-size:.75rem;font-weight:700;font-variant-numeric:tabular-nums}
.run .ritem.now{background:#263247;box-shadow:0 0 0 2px var(--c)}
.run .ritem.now.done{opacity:.7}
.run .notes{background:#1e293b;border-radius:14px;padding:12px 14px;white-space:pre-wrap;color:#cbd5e1}
/* Reloj fijo arriba en modo entreno */
.run .rclock{position:sticky;top:env(safe-area-inset-top);z-index:5;background:#0f172a;box-shadow:0 -14px 0 #0f172a;padding:2px 0 8px;margin-bottom:8px;border-bottom:1px solid #1e293b}
.run .rclock .big{font-size:3.2rem;font-weight:800;color:#fff;letter-spacing:.02em;font-variant-numeric:tabular-nums;line-height:1}
.run .rclock .meta{text-align:center;color:#94a3b8;font-size:.85rem;margin-top:6px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:5px;cursor:pointer}
.run .rclock .meta.late{color:#f87171}
.run .rclock .meta.early{color:#7dd3fc}
.run .rclock .meta.ok{color:#4ade80}
.run .rclock .btn{background:#1e293b;color:#7dd3fc;border-color:#334155;box-shadow:none}

/* Pizarra táctica */
.board{position:fixed;inset:0;background:#0f172a;z-index:60;display:flex;flex-direction:column;color:#e2e8f0;padding-top:env(safe-area-inset-top)}
.board-top{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 10px}
.board-top .back{color:#7dd3fc}
.board-top .ttl{font-weight:800;display:inline-flex;align-items:center;gap:6px}
.board-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px}
.board-wrap canvas{touch-action:none;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.45);display:block}
.board-tools{background:#1e293b;padding:6px 8px calc(8px + env(safe-area-inset-bottom))}
.board-tools .trow{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;padding:3px 0}
.board-tools .tb{min-width:42px;height:42px;padding:0 10px;border-radius:12px;background:#334155;color:#e2e8f0;display:inline-flex;align-items:center;justify-content:center;gap:4px;font-weight:800;font-size:.8rem}
.board-tools .tb .ic{width:20px;height:20px}
.board-tools .tb.on{background:#0284c7;color:#fff}
.board-tools .tb.tok{border-radius:50%;width:42px;padding:0}
.board-tools .sw{width:28px;height:28px;border-radius:50%;border:3px solid transparent;flex:none}
.board-tools .sw.on{border-color:#fff}
.board-tools .sep{width:1px;height:28px;background:#475569;margin:0 4px}

/* Mocho: marcador */
.mocho{position:fixed;inset:0;background:#0f172a;z-index:60;display:flex;flex-direction:column;color:#e2e8f0;padding:env(safe-area-inset-top) 0 calc(12px + env(safe-area-inset-bottom));overflow-y:auto;-webkit-overflow-scrolling:touch}
.mocho>*{width:100%;max-width:640px;margin-left:auto;margin-right:auto}
.mocho-top{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 10px}
.mocho-top .back{color:#7dd3fc}
.mocho-top .ttl{font-weight:800;display:inline-flex;align-items:center;gap:6px}
.mocho .mclock{text-align:center;color:#94a3b8;font-weight:700;font-size:.82rem;padding:2px 12px 4px}
.mocho .mclock b{display:block;color:#fff;font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.1}
.mocho .courts{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:8px 12px}
.mocho .side-p{background:#1e293b;border-radius:18px;padding:12px 8px 10px;text-align:center;cursor:pointer;border:3px solid transparent;user-select:none;-webkit-user-select:none}
.mocho .side-p:active{transform:scale(.97)}
.mocho .side-p.a{border-color:#2563eb}.mocho .side-p.b{border-color:#ea580c}
.mocho .side-p.won{border-color:#16a34a;background:#14532d}
.mocho .side-p .nm{font-weight:800;font-size:.95rem;min-height:2.4em;display:flex;align-items:center;justify-content:center;color:#fff;word-break:break-word}
.mocho .side-p .sc{font-size:4.6rem;font-weight:900;line-height:1;color:#fff;font-variant-numeric:tabular-nums;margin:4px 0}
.mocho .side-p .lb{font-size:.7rem;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em;font-weight:700;display:flex;align-items:center;justify-content:center;gap:4px}
.mocho .side-p.a .lb.top{color:#60a5fa}.mocho .side-p.b .lb.top{color:#fb923c}
.mocho .banner{margin:4px 12px 8px;background:#facc15;color:#422006;border-radius:14px;padding:10px 12px;text-align:center;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px}
.mocho .banner.win{background:#16a34a;color:#fff}
.mocho .macts{display:flex;gap:8px;padding:4px 12px 8px;flex-wrap:wrap}
.mocho .macts .btn{flex:1;background:#1e293b;color:#e2e8f0;border-color:#334155;box-shadow:none}
.mocho .macts .btn.go{background:#0284c7;color:#fff;border-color:#0284c7}
.mocho .tally{padding:4px 12px}
.mocho .tally h4{margin:6px 4px 6px;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:#94a3b8;display:flex;justify-content:space-between}
.mocho .tally .tr{display:flex;align-items:center;gap:8px;background:#1e293b;border-radius:12px;padding:9px 12px;margin-bottom:6px;cursor:pointer}
.mocho .tally .tr.on{outline:2px solid #e11d48}
.mocho .tally .tr b{flex:1;color:#fff}
.mocho .tally .tr .n{font-size:1.25rem;font-weight:900;color:#fff;min-width:28px;text-align:right;font-variant-numeric:tabular-nums}
.mocho .tally .tr .q{font-size:.72rem;color:#94a3b8;font-weight:700}
.mocho .mhint{padding:4px 16px;color:#64748b;font-size:.8rem;text-align:center}

/* Schedule */
.day{margin-bottom:8px}
.day h4{margin:0 0 4px 4px;font-size:.8rem;text-transform:uppercase;color:var(--muted);letter-spacing:.04em}
.slot{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:8px 12px;margin-bottom:4px;box-shadow:var(--shadow)}
.slot .time{font-weight:700;color:var(--primary-dark);width:104px;flex:none;font-size:.9rem}
.sched-row{display:grid;grid-template-columns:1.3fr 1fr 1fr auto;gap:6px;margin-bottom:6px;align-items:center}
.sched-row select,.sched-row input{border:1.5px solid var(--line);border-radius:10px;padding:8px 6px;background:#fafaf7;width:100%}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block;flex:none}
.colors{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.colors button{width:34px;height:34px;border-radius:50%;border:3px solid transparent}
.colors button.on{border-color:#1f2937}

/* Tabs */
#tabs{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(to bottom,#fff 0,#fff 58%,var(--tabs-tail) 100%);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:3px 4px var(--tabs-pb);z-index:30}
#tabs button{flex:1;max-width:128px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px 3px;color:var(--muted);font-size:.68rem;font-weight:600;border-radius:12px}
#tabs button .ic{width:24px;height:24px;stroke-width:1.9}
#tabs button.active{color:var(--primary)}
#tabs button.active .ic{stroke-width:2.4}

/* Modal */
.backdrop{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:calc(100% - env(safe-area-inset-top) - 24px);overflow:auto;-webkit-overflow-scrolling:touch;border-radius:22px 22px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.sheet-head h3{font-size:1.15rem;display:flex;align-items:center;gap:8px}
.sheet .close{width:34px;height:34px;border-radius:50%;background:#e7e2d6;display:inline-flex;align-items:center;justify-content:center;flex:none}
.search{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;background:#fff;font-size:1rem;margin-bottom:8px}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted);font-weight:600;margin-right:12px}
.toggle input{width:18px;height:18px}
.detail p{margin:6px 0;white-space:pre-wrap}
.detail .k{font-size:.75rem;text-transform:uppercase;color:var(--muted);font-weight:700;letter-spacing:.04em;margin-top:12px;display:flex;align-items:center;gap:5px}
.hint{font-size:.85rem;color:var(--muted);line-height:1.5}
.hint ol{padding-left:18px;margin:6px 0}
</style>
</head>

<script>

const ic = (n, cls = '') => `<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n] || ''}</svg>`;

/* ============================ CONSTANTES ============================ */
const KEY = 'beachcoach_v1';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const DAYS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const DAYS_SHORT = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const MONTHS_SHORT = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const WEEK_ORDER = [1,2,3,4,5,6,0];
const PHASES = [
  { id:'wnb',  name:'Calentamiento sin bola', short:'Sin bola',  icon:'activity', color:'#f59e0b' },
  { id:'wb',   name:'Calentamiento con bola', short:'Con bola',  icon:'ball',     color:'#f97316' },
  { id:'tech', name:'Gesto técnico',          short:'Técnica',   icon:'target',   color:'#0284c7' },
  { id:'drill',name:'Ejercicios',             short:'Ejercicio', icon:'zap',      color:'#16a34a' },
  { id:'game', name:'Juegos',                 short:'Juegos',    icon:'gamepad',  color:'#a855f7' },
];

/* Gestos técnicos → subtipos */
const TECH_TREE = {

  'Recepción': ['Posición base y desplazamientos','Recepción de antebrazos','Recepción de saque flotante','Recepción de saque en salto','Recepción de skyball','Recepción bola corta','Recepción bola larga / al fondo','Recepción lateral (desplazamiento)','Recepción alta (por encima del hombro)','Recepción con manos (tomahawk / puños)','Recepción con viento','Recepción con sol','Lectura del sacador','Comunicación (mía / tuya)','Dirección y altura del pase','Recepción y aproximación al ataque'],

  'Ataque': ['Carrera de aproximación y salto','Remate diagonal','Remate diagonal corta (cut shot)','Remate diagonal larga','Remate línea','Remate al centro (seam)','Dejada / dink','Bola alta por línea (high line)','Rainbow (bola alta diagonal)','Poke / cobra','Jumbo / muñeca','Bola de dedos (pokey / knuckle)','Ataque desde segundo toque','Ataque en bola imperfecta','Ataque en viento','Ataque sobre bloqueo (por encima / a las manos)','Ataque contra no-bloqueo (2 atrás)','Ataque desde posición separada','Selección de golpe (lectura de defensa)','Finta y cambio de ritmo','Ataque bajo presión'],

  'Control de balón': ['Toque de dedos','Toque de antebrazos','Pases en parejas','Pases en movimiento','Pepper (defensa-colocación-ataque)','Pepper avanzado','Coordinación con balón','Juegos de calentamiento con bola','Autopases y control individual'],

const TECH_CATS = Object.keys(TECH_TREE);
const COLORS = ['#22c55e','#3b82f6','#f59e0b','#ef4444','#a855f7','#ec4899','#14b8a6','#64748b'];

/* Mocho: juego final del entreno */
const MOCHO_COLOR = '#e11d48';
const MOCHO_MODES = [
  { id:'king',  name:'King',          desc:'Rey de la pista: la pareja que gana el punto se queda como rey y la que pierde sale. Solo puntúa el rey al ganar el punto.' },
  { id:'p21',   name:'Partido a 21',  desc:'Un partido 2v2 a 21 puntos con diferencia de dos. Cambio de campo cada 7 puntos.' },
  { id:'best3', name:'Mejor de 3',    desc:'Mini-partidos al mejor de 3 (gana quien llega a 2). Van entrando parejas y se cuentan los partidos ganados.' },

const mochoMode = id => MOCHO_MODES.find(x => x.id === id) || MOCHO_MODES[0];
function mochoDefault(on){ return { on, mode:'king', duration:20, pairs:'', live:null }; }
function mochoPairs(m){ return (m.pairs || '').split('\n').map(x => x.trim()).filter(Boolean); }

/* ============================ DATOS ============================ */
function defaultState(){
  return {
    levels:[
      { id:'l1', name:'Iniciación',  color:'#22c55e' },
      { id:'l2', name:'Intermedio',  color:'#3b82f6' },
      { id:'l3', name:'Avanzado',    color:'#f59e0b' },
      { id:'l4', name:'Competición', color:'#ef4444' },
    ],
    groups:[], exercises:[], sessions:[]
  };
}
function migrate(s){
  s.sessions.forEach(x => { x.blocks = x.blocks || {}; PHASES.forEach(p => { x.blocks[p.id] = x.blocks[p.id] || []; }); x.focusSub = x.focusSub || ''; x.title = x.title || ''; x.notes = x.notes || ''; x.mocho = x.mocho || mochoDefault(false); });
  s.exercises.forEach(e => { if (e.tech === 'Juego real') e.tech = 'Juego'; e.sub = e.sub || ''; e.levelIds = e.levelIds || []; });
  s.groups.forEach(g => { g.schedule = g.schedule || []; });
  return s;
}
let state = load();
function load(){
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.levels) return migrate(Object.assign(defaultState(), s)); } catch(e){}
  return defaultState();
}
function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }

const byId  = (arr, id) => arr.find(x => x.id === id);
const level = id => byId(state.levels, id);
const phase = id => byId(PHASES, id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromISO = iso => { const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); };
const todayISO = () => toISO(new Date());
function fmtDateLong(d){ return d.toLocaleDateString('es-ES', { weekday:'long', day:'numeric', month:'long' }); }
function fmtDate(iso){ const d = fromISO(iso); return `${DAYS_SHORT[d.getDay()]} ${d.getDate()} ${MONTHS_SHORT[d.getMonth()]}`; }
function techLabel(ex){ return ex.tech ? (ex.sub ? `${ex.tech} · ${ex.sub}` : ex.tech) : ''; }

/* ============================ ROUTER ============================ */
let route = { view:'hoy' };
const TABS = [
  { id:'hoy',        label:'Hoy',        icon:'sun' },
  { id:'semana',     label:'Semana',     icon:'calendar' },
  { id:'ejercicios', label:'Ejercicios', icon:'ball' },
  { id:'grupos',     label:'Grupos',     icon:'users' },
  { id:'ajustes',    label:'Ajustes',    icon:'sliders' },
];
const TAB_OF = { hoy:'hoy', semana:'semana', entrenos:'semana', session:'semana', run:'semana', ejercicios:'ejercicios', grupos:'grupos', ajustes:'ajustes' };
function go(view, params = {}){ route = { view, ...params }; render(); document.getElementById('app').scrollTop = 0; }
function render(){
  const views = { hoy:renderHoy, semana:renderSemana, entrenos:renderEntrenos, session:renderSession, run:renderRun, ejercicios:renderEjercicios, grupos:renderGrupos, ajustes:renderAjustes };
  document.getElementById('app').innerHTML = (views[route.view] || renderHoy)();
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = TABS.map(t => `<button class="${TAB_OF[route.view]===t.id?'active':''}" onclick="go('${t.id}')">${ic(t.icon)}${t.label}</button>`).join('');
  tabs.style.display = route.view === 'run' ? 'none' : '';
  document.body.classList.toggle('run-mode', route.view === 'run');
  const tc = document.querySelector('meta[name="theme-color"]'); if (tc) tc.content = route.view === 'run' ? '#0f172a' : '#0284c7';
  if (route.view === 'run') tickClock();
}

/* ============================ HELPERS UI ============================ */
function levelChips(ids, small){
  const ls = (ids && ids.length) ? ids.map(level).filter(Boolean) : [];
  if (!ls.length) return `<span class="chip ${small?'sm':''} all">Todos los niveles</span>`;
  return ls.map(l => `<span class="chip ${small?'sm':''}" style="background:${l.color}22;color:${l.color}">${esc(l.name)}</span>`).join('');
}
function levelChip(id, small){
  const l = level(id); if (!l) return '';
  return `<span class="chip ${small?'sm':''}" style="background:${l.color}22;color:${l.color}">${esc(l.name)}</span>`;
}
function phaseTag(pid){ const p = phase(pid); return p ? `<span class="tag phase" style="background:${p.color}">${ic(p.icon)} ${esc(p.short)}</span>` : ''; }
function techTag(ex){ const t = techLabel(ex); return t ? `<span class="tag">${esc(t)}</span>` : ''; }
function empty(text, icon='umbrella'){ return `<div class="empty">${ic(icon)}<div>${text}</div></div>`; }
function groupName(id){ const g = byId(state.groups, id); return g ? g.name : 'Sin grupo'; }
function sessionTotal(s){ return PHASES.reduce((a,p) => a + (s.blocks[p.id]||[]).reduce((b,i) => b + (+i.duration||0), 0), 0) + (s.mocho && s.mocho.on ? (+s.mocho.duration||0) : 0); }
function sessionCount(s){ return PHASES.reduce((a,p) => a + (s.blocks[p.id]||[]).length, 0); }
function sessionFocus(s){ return s.focus ? (s.focusSub ? `${s.focus} · ${s.focusSub}` : s.focus) : ''; }
function sessionTitle(s){ return s.title || (s.focus ? `Entreno de ${s.focus.toLowerCase()}` : 'Entreno'); }
function subOptions(cat, sel){ return `<option value="">— general —</option>${(TECH_TREE[cat]||[]).map(x => `<option ${x===sel?'selected':''}>${esc(x)}</option>`).join('')}`; }

/* ============================ MODAL ============================ */
function openModal(html){
  document.getElementById('modal-root').innerHTML = `<div class="backdrop" onclick="if(event.target===this)closeModal()"><div class="sheet">${html}</div></div>`;
  document.body.classList.add('noscroll');
}
function closeModal(){ document.getElementById('modal-root').innerHTML = ''; document.body.classList.remove('noscroll'); }
function sheetHead(title){ return `<div class="sheet-head"><h3>${title}</h3><button class="close" onclick="closeModal()">${ic('x')}</button></div>`; }

/* ============================ SEMANA (datos) ============================ */
let curWeek = null;
function mondayOf(d){ const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate() - ((x.getDay()+6)%7)); return x; }
function defaultWeek(){ const t = new Date(); const m = mondayOf(t); if (t.getDay() === 0) m.setDate(m.getDate()+7); return toISO(m); }
function shiftWeek(n){ const m = fromISO(curWeek || defaultWeek()); m.setDate(m.getDate() + 7*n); curWeek = toISO(m); render(); }
function weekData(monISO){
  const mon = fromISO(monISO);
  return [...Array(7)].map((_, i) => {
    const d = new Date(mon); d.setDate(mon.getDate() + i); const iso = toISO(d), dow = d.getDay();
    const sched = state.groups.flatMap(g => g.schedule.filter(s => s.day === dow).map(s => ({ g, s, iso, session: state.sessions.find(x => x.groupId === g.id && x.date === iso) })))
      .sort((a,b) => a.s.start.localeCompare(b.s.start));
    const extra = state.sessions.filter(x => x.date === iso && !sched.some(k => k.session && k.session.id === x.id));
    return { d, iso, dow, sched, extra };
  });
}
function createSession(groupId, date){
  const s = { id:uid(), groupId: groupId || (state.groups[0] ? state.groups[0].id : ''), date: date || todayISO(),
    focus:'', focusSub:'', title:'', notes:'', blocks:{}, mocho: mochoDefault(true) };
  PHASES.forEach(p => s.blocks[p.id] = []);
  state.sessions.push(s); save(); return s;
}
function newSession(groupId, date){ const s = createSession(groupId, date); go('session', { id:s.id }); }
function prepareWeek(){
  const missing = weekData(curWeek || defaultWeek()).flatMap(x => x.sched.filter(k => !k.session));
  if (!missing.length) return;
  if (!confirm(`Se crearán ${missing.length} entrenos vacíos para que los rellenes uno a uno. ¿Continuar?`)) return;
  missing.forEach(k => createSession(k.g.id, k.iso)); render();
}
function copyLast(groupId, iso){
  const prev = state.sessions.filter(x => x.groupId === groupId && x.date < iso && sessionCount(x) > 0).sort((a,b) => b.date.localeCompare(a.date))[0];
  if (!prev) { alert('Este grupo todavía no tiene entrenos anteriores con contenido.'); return; }
  const c = JSON.parse(JSON.stringify(prev)); c.id = uid(); c.date = iso; c.mocho.live = null; state.sessions.push(c); save(); go('session', { id:c.id });
}

/* ============================ HOY ============================ */
function renderHoy(){
  const today = new Date(), dow = today.getDay(), iso = todayISO();
  const todays = state.groups.flatMap(g => g.schedule.filter(s => s.day === dow).map(s => ({ g, s }))).sort((a,b) => a.s.start.localeCompare(b.s.start));
  const wk = weekData(defaultWeek());
  const slots = wk.flatMap(x => x.sched); const done = slots.filter(k => k.session).length;
  const isSunday = dow === 0;
  const upcoming = state.sessions.filter(s => s.date > iso).sort((a,b) => a.date.localeCompare(b.date)).slice(0, 4);
  return `
  <div class="hero">
    ${ic('ball','bgic')}
    <div class="date">${fmtDateLong(today)}</div>
    <h1>Hola, coach</h1>
    <div class="stats">
      <div class="stat"><b>${state.exercises.length}</b>ejercicios</div>
      <div class="stat"><b>${state.groups.length}</b>grupos</div>
      <div class="stat"><b>${state.sessions.length}</b>entrenos</div>
    </div>
  </div>

  ${slots.length ? `<div class="card plan" style="margin-top:12px">
    <div class="row between"><div class="title">${ic('calendar')} ${isSunday ? 'Es domingo: planifica la próxima semana' : 'Planificación de la semana'}</div><span class="badge ${done===slots.length?'ok':''}">${done}/${slots.length}</span></div>
    <div class="progress"><span style="width:${slots.length?Math.round(done/slots.length*100):0}%"></span></div>
    <div class="sub">${done === slots.length ? 'Todos los entrenos de la semana están preparados.' : (slots.length-done === 1 ? 'Te falta <b>1</b> entreno por preparar.' : `Te faltan <b>${slots.length-done}</b> entrenos por preparar.`)}</div>
    <button class="btn ${done===slots.length?'':'accent'} block" onclick="curWeek=null;go('semana')">${ic('calendar')} Ver la semana</button>
  </div>` : ''}

  <h2><span class="t">${ic('sun')} Entrenos de hoy</span></h2>
  ${todays.length ? todays.map(({g,s}) => {
      const ses = state.sessions.find(x => x.groupId === g.id && x.date === iso);
      return `<div class="card">
        <div class="row between">
          <div class="grow"><div class="title">${esc(g.name)}</div><div class="sub">${ic('clock')} ${s.start} – ${s.end} ${levelChip(g.levelId, true)}</div></div>
          ${ses ? `<span class="badge">${sessionTotal(ses)} min</span>` : ''}
        </div>
        ${ses ? `<div class="sub" style="margin-top:6px">${esc(sessionTitle(ses))} · ${sessionCount(ses)} ejercicios</div>
          <div class="row" style="margin-top:10px"><button class="btn small grow" onclick="go('session',{id:'${ses.id}'})">${ic('edit')} Editar</button><button class="btn small primary grow" onclick="go('run',{id:'${ses.id}'})">${ic('play','fill')} Modo entreno</button></div>`
        : `<button class="btn accent block" onclick="newSession('${g.id}','${iso}')">${ic('plus')} Preparar el entreno</button>`}
      </div>`;
    }).join('') : (state.groups.length ? empty('Hoy no tienes grupos programados. Día libre.','umbrella') : empty('Empieza creando tus grupos y horarios en la pestaña <b>Grupos</b>.','users'))}

  <h2><span class="t">${ic('flag')} Próximos entrenos</span></h2>
  ${upcoming.length ? upcoming.map(sessionCard).join('') : empty('No hay entrenos planificados. Ve a <b>Semana</b> para prepararlos.','calendar')}`;
}

/* ============================ SEMANA (vista) ============================ */
function renderSemana(){
  const monISO = curWeek || defaultWeek();
  const wk = weekData(monISO);
  const mon = wk[0].d, sun = wk[6].d, todayIso = todayISO();
  const thisMon = toISO(mondayOf(new Date()));
  const rel = monISO === thisMon ? 'Esta semana' : (monISO === toISO(new Date(mondayOf(new Date()).getTime() + 7*864e5)) ? 'Próxima semana' : (monISO < thisMon ? 'Semana pasada' : ''));
  const slots = wk.flatMap(x => x.sched); const done = slots.filter(k => k.session).length; const missing = slots.length - done;
  const totalMin = wk.flatMap(x => [...x.sched.map(k => k.session), ...x.extra]).filter(Boolean).reduce((a,s) => a + sessionTotal(s), 0);
  return `
  <div class="segbar"><button class="on">${ic('calendar')} Semana</button><button onclick="go('entrenos')">${ic('list')} Todos los entrenos</button></div>
  <div class="wk-nav">
    <button class="icon-btn lg" onclick="shiftWeek(-1)">${ic('left')}</button>
    <div class="lbl"><b>${mon.getDate()} ${MONTHS_SHORT[mon.getMonth()]} – ${sun.getDate()} ${MONTHS_SHORT[sun.getMonth()]}</b><br><small>${rel || `Semana del ${mon.getDate()}`}</small></div>
    <button class="icon-btn lg" onclick="shiftWeek(1)">${ic('right')}</button>
  </div>
  ${slots.length ? `<div class="card plan">
    <div class="row between"><div class="title">${done}/${slots.length} entrenos preparados</div><small>${totalMin} min en total</small></div>
    <div class="progress"><span style="width:${Math.round(done/slots.length*100)}%"></span></div>
    ${missing ? `<button class="btn accent block" onclick="prepareWeek()">${ic('sparkle')} ${missing === 1 ? 'Crear el que falta' : `Crear los ${missing} que faltan`}</button>` : `<div class="sub">${ic('check')} Semana completa. ¡A la arena!</div>`}
  </div>` : (state.groups.length ? '' : empty('Crea tus grupos con horario en <b>Grupos</b> y aquí aparecerá tu semana.','users'))}
  ${wk.map(day => {
    const isToday = day.iso === todayIso;
    return `<div class="card wk-day ${isToday?'today':''}">
      <div class="dh"><b>${DAYS[day.dow]}</b><small>${day.d.getDate()} ${MONTHS_SHORT[day.d.getMonth()]}</small>${isToday ? '<span class="badge">Hoy</span>' : ''}${!day.sched.length && !day.extra.length ? '<span class="free">Libre</span>' : ''}</div>
      ${day.sched.map(k => weekSlot(k.g, `${k.s.start}–${k.s.end}`, k.session, k.iso)).join('')}
      ${day.extra.map(x => weekSlot(byId(state.groups, x.groupId), 'Extra', x, day.iso)).join('')}
      <button class="btn ghost small" style="margin-top:6px;padding-left:4px" onclick="newSession('', '${day.iso}')">${ic('plus')} Añadir otro entreno</button>
    </div>`; }).join('')}`;
}
function weekSlot(g, time, ses, iso){
  const hasPrev = g && state.sessions.some(x => x.groupId === g.id && x.date < iso && sessionCount(x) > 0);
  return `<div class="wk-slot">
    <div class="row between top">
      <div class="grow"><b>${esc(g ? g.name : 'Sin grupo')}</b> ${g ? levelChip(g.levelId, true) : ''}<div class="tm">${ic('clock')} ${time}</div></div>
      ${ses ? (sessionCount(ses) ? `<span class="badge ok">${ic('check')} ${sessionTotal(ses)} min</span>` : `<span class="badge empty">Vacío</span>`) : `<span class="badge todo">Sin preparar</span>`}
    </div>
    ${ses ? `<div class="sub">${esc(sessionTitle(ses))}${sessionFocus(ses) ? ` · ${esc(sessionFocus(ses))}` : ''} · ${sessionCount(ses)} ej.</div>
      <div class="row" style="margin-top:8px">
        <button class="btn small grow" onclick="go('session',{id:'${ses.id}'})">${ic('edit')} Editar</button>
        <button class="btn small primary grow" onclick="go('run',{id:'${ses.id}'})">${ic('play','fill')} Entreno</button>
      </div>`
    : `<div class="row" style="margin-top:8px">
        <button class="btn small accent grow" onclick="newSession('${g?g.id:''}','${iso}')">${ic('plus')} Preparar</button>
        ${hasPrev ? `<button class="btn small grow" onclick="copyLast('${g.id}','${iso}')">${ic('copy')} Copiar último</button>` : ''}
      </div>`}
  </div>`;
}

/* ============================ ENTRENOS (lista) ============================ */
function sessionCard(s){
  const d = fromISO(s.date), iso = todayISO();
  const cls = s.date === iso ? 'today' : (s.date < iso ? 'past' : '');
  const g = byId(state.groups, s.groupId);
  return `<div class="card tap" onclick="go('session',{id:'${s.id}'})">
    <div class="sess">
      <div class="datebox ${cls}"><span>${DAYS_SHORT[d.getDay()]}</span><b>${d.getDate()}</b><span>${MONTHS_SHORT[d.getMonth()]}</span></div>
      <div class="grow">
        <div class="title">${esc(sessionTitle(s))}</div>
        <div class="sub">${esc(groupName(s.groupId))} ${g ? levelChip(g.levelId, true) : ''}</div>
        <div class="sub">${sessionCount(s)} ejercicios · ${sessionTotal(s)} min${sessionFocus(s) ? ` · ${esc(sessionFocus(s))}` : ''}</div>
      </div>
    </div></div>`;
}
function renderEntrenos(){
  const iso = todayISO();
  const up = state.sessions.filter(s => s.date >= iso).sort((a,b) => a.date.localeCompare(b.date));
  const past = state.sessions.filter(s => s.date < iso).sort((a,b) => b.date.localeCompare(a.date));
  return `
  <div class="segbar"><button onclick="go('semana')">${ic('calendar')} Semana</button><button class="on">${ic('list')} Todos los entrenos</button></div>
  <h2><span class="t">Próximos</span><small>${up.length}</small></h2>
  ${up.length ? up.map(sessionCard).join('') : empty('Nada planificado todavía.','calendar')}
  ${past.length ? `<h2><span class="t">Anteriores</span><small>${past.length}</small></h2>${past.map(sessionCard).join('')}` : ''}
  <button class="fab" onclick="newSession()">${ic('plus')} Nuevo entreno</button>`;
}

/* ============================ EDITOR DE ENTRENO ============================ */
function updSession(id, k, v){ const s = byId(state.sessions, id); if (!s) return; s[k] = v; if (k === 'focus') s.focusSub = ''; save(); render(); }
function deleteSession(id){
  if (!confirm('¿Eliminar este entreno?')) return;
  state.sessions = state.sessions.filter(s => s.id !== id); save(); go('semana');
}
function duplicateSession(id){
  const s = byId(state.sessions, id); if (!s) return;
  const c = JSON.parse(JSON.stringify(s)); c.id = uid(); c.mocho.live = null; state.sessions.push(c); save(); go('session', { id:c.id });
}
function updItem(sid, pid, idx, k, v){ const s = byId(state.sessions, sid); s.blocks[pid][idx][k] = k === 'duration' ? +v : v; save(); render(); }
function moveItem(sid, pid, idx, dir){
  const arr = byId(state.sessions, sid).blocks[pid]; const j = idx + dir;
  if (j < 0 || j >= arr.length) return; [arr[idx], arr[j]] = [arr[j], arr[idx]]; save(); render();
}
function removeItem(sid, pid, idx){ byId(state.sessions, sid).blocks[pid].splice(idx, 1); save(); render(); }
function addToSession(sid, pid, exId){
  const s = byId(state.sessions, sid), ex = byId(state.exercises, exId); if (!s || !ex) return;
  s.blocks[pid] = s.blocks[pid] || []; s.blocks[pid].push({ exId, duration: ex.duration || 10 }); save();
}

function renderSession(){
  const s = byId(state.sessions, route.id); if (!s) return renderSemana();
  const total = sessionTotal(s);
  return `
  <div class="page-head">
    <button class="back" onclick="go('semana')">${ic('left')} Semana</button>
    <div class="head-actions">
      <button class="btn small" onclick="duplicateSession('${s.id}')">${ic('copy')} Duplicar</button>
      <button class="btn small primary" onclick="go('run',{id:'${s.id}'})">${ic('play','fill')} Modo entreno</button>
    </div>
  </div>
  <div class="card">
    <div class="grid2">
      <label class="f">Grupo<select onchange="updSession('${s.id}','groupId',this.value)">
        <option value="">— sin grupo —</option>
        ${state.groups.map(g => `<option value="${g.id}" ${g.id===s.groupId?'selected':''}>${esc(g.name)} · ${esc(level(g.levelId)?.name||'')}</option>`).join('')}
      </select></label>
      <label class="f">Fecha<input type="date" value="${s.date}" onchange="updSession('${s.id}','date',this.value)"></label>
    </div>
    <div class="grid2">
      <label class="f">Gesto técnico principal<select onchange="updSession('${s.id}','focus',this.value)">
        <option value="">— elegir —</option>${TECH_CATS.map(t => `<option ${t===s.focus?'selected':''}>${t}</option>`).join('')}
      </select></label>
      <label class="f">Subtipo<select ${!s.focus || !TECH_TREE[s.focus].length ? 'disabled' : ''} onchange="updSession('${s.id}','focusSub',this.value)">${subOptions(s.focus, s.focusSub)}</select></label>
    </div>
    <label class="f">Título (opcional)<input value="${esc(s.title)}" placeholder="p.ej. Recepción bajo presión" onchange="updSession('${s.id}','title',this.value)"></label>
    <div class="total"><span>${ic('clock')} Duración total</span><b>${total} min</b></div>
  </div>
  ${PHASES.map(p => renderBlock(s, p)).join('')}
  ${renderMochoBlock(s)}
  <div class="card"><label class="f">Notas del entreno<textarea placeholder="Recordatorios, material, quién falta..." onchange="updSession('${s.id}','notes',this.value)">${esc(s.notes)}</textarea></label></div>
  <button class="btn danger block" onclick="deleteSession('${s.id}')">${ic('trash')} Eliminar entreno</button>`;
}
function renderBlock(s, p){
  const items = s.blocks[p.id] || [];
  const sub = items.reduce((a,i) => a + (+i.duration||0), 0);
  const g = byId(state.groups, s.groupId);
  const name = p.id === 'tech' && s.focus ? `${p.name}: ${esc(sessionFocus(s))}` : p.name;
  const pre = JSON.stringify({ phase:p.id, tech: p.id==='tech' ? s.focus : '', sub: p.id==='tech' ? s.focusSub : '', levelIds: g ? [g.levelId] : [], addTo:{ sessionId:s.id, phase:p.id } });
  return `<section class="block" style="--c:${p.color}">
    <div class="block-head"><div class="bic">${ic(p.icon)}</div><div class="grow"><h3>${name}</h3><small>${items.length} ejercicio${items.length===1?'':'s'} · ${sub} min</small></div></div>
    <div class="items">${items.map((it, idx) => {
      const ex = byId(state.exercises, it.exId);
      return `<div class="item">
        <div class="item-main" onclick="${ex?`openExercise('${ex.id}')`:''}">
          <b>${esc(ex ? ex.name : '(ejercicio eliminado)')}</b>
          ${ex ? `${techTag(ex)}${levelChips(ex.levelIds, true)}` : ''}
        </div>
        <div class="item-side"><input type="number" min="0" inputmode="numeric" value="${it.duration}" onchange="updItem('${s.id}','${p.id}',${idx},'duration',this.value)"><span class="min">min</span></div>
        <div class="item-actions">
          <button class="icon-btn" onclick="moveItem('${s.id}','${p.id}',${idx},-1)">${ic('up')}</button>
          <button class="icon-btn" onclick="moveItem('${s.id}','${p.id}',${idx},1)">${ic('down')}</button>
          <button class="icon-btn del" onclick="removeItem('${s.id}','${p.id}',${idx})">${ic('x')}</button>
        </div>
      </div>`; }).join('')}</div>
    <div class="block-actions">
      <button class="btn small primary" onclick="openPicker('${s.id}','${p.id}')">${ic('book')} De la batería</button>
      <button class="btn small" onclick='openExerciseForm(null,${esc(pre)})'>${ic('plus')} Crear nuevo</button>
    </div>
  </section>`;
}

/* ---- Bloque Mocho en el editor ---- */
function updMocho(id, k, v){ const s = byId(state.sessions, id); if (!s) return; s.mocho[k] = k === 'duration' ? +v : v; if (k === 'mode' || k === 'pairs') s.mocho.live = null; save(); render(); }
function renderMochoBlock(s){
  const m = s.mocho, md = mochoMode(m.mode);
  return `<section class="block" style="--c:${MOCHO_COLOR}">
    <div class="block-head"><div class="bic">${ic('trophy')}</div><div class="grow"><h3>Mocho · juego final</h3><small>${m.on ? `${md.name} · ${m.duration} min` : 'Desactivado'}</small></div></div>
    <div style="padding:0 14px 14px">
      <label class="toggle" style="margin:0 0 6px"><input type="checkbox" ${m.on?'checked':''} onchange="updMocho('${s.id}','on',this.checked)">Hacer mocho al final del entreno</label>
      ${m.on ? `
      <div class="seg" style="margin-bottom:8px">${MOCHO_MODES.map(x => `<button type="button" class="${m.mode===x.id?'on':''}" style="--c:${MOCHO_COLOR};flex:1 1 40%" onclick="updMocho('${s.id}','mode','${x.id}')">${x.name}</button>`).join('')}</div>
      <p class="hint" style="margin:0 0 12px">${md.desc}</p>
      <div class="grid2">
        <label class="f">Duración (min)<input type="number" min="0" inputmode="numeric" value="${m.duration}" onchange="updMocho('${s.id}','duration',this.value)"></label>
        <div style="display:flex;align-items:flex-end;margin-bottom:12px"><button class="btn block" style="margin:0;background:${MOCHO_COLOR};color:#fff;border-color:${MOCHO_COLOR}" onclick="openMocho('${s.id}')">${ic('trophy')} Marcador</button></div>
      </div>
      ${m.mode === 'p21' ? `<label class="f">Parejas (una por línea, opcional)<textarea style="min-height:60px" placeholder="Ana y Luis&#10;Marta y Pol" onchange="updMocho('${s.id}','pairs',this.value)">${esc(m.pairs)}</textarea></label>`
        : `<label class="f">Parejas (una por línea, opcional)<textarea placeholder="Ana y Luis&#10;Marta y Pol&#10;Jon y Sara&#10;..." onchange="updMocho('${s.id}','pairs',this.value)">${esc(m.pairs)}</textarea></label>`}
      ${m.live && (m.live.games || m.live.pairs.some(p => p.pts)) ? `<small>${ic('info')} Hay un marcador en curso guardado. Cambiar la modalidad o las parejas lo reinicia.</small>` : ''}` : ''}
    </div>
  </section>`;
}

/* ---- Selector de ejercicios de la batería ---- */
let picker = null;
function openPicker(sessionId, phaseId){ picker = { sessionId, phaseId, onlyPhase:true, onlyLevel:true, q:'' }; renderPicker(); }
function pickerSet(k, v){ picker[k] = v; renderPicker(); }
function pickerAdd(exId){ addToSession(picker.sessionId, picker.phaseId, exId); render(); renderPicker(); }
function pickerFiltered(){
  const s = byId(state.sessions, picker.sessionId); const g = byId(state.groups, s.groupId);
  const q = picker.q.trim().toLowerCase();
  const list = state.exercises.filter(ex =>
    (!picker.onlyPhase || ex.phase === picker.phaseId) &&
    (!picker.onlyLevel || !g || !ex.levelIds.length || ex.levelIds.includes(g.levelId)) &&
    (!q || (ex.name + ' ' + techLabel(ex) + ' ' + (ex.description||'')).toLowerCase().includes(q))
  ).sort((a,b) => a.name.localeCompare(b.name));
  if (picker.phaseId === 'tech' && s.focus) {
    const score = ex => (ex.tech === s.focus ? 1 : 0) + (s.focusSub && ex.sub === s.focusSub ? 2 : 0);
    list.sort((a,b) => score(b) - score(a));
  }
  return { s, g, list, inSession: new Set((s.blocks[picker.phaseId]||[]).map(i => i.exId)) };
}
function renderPicker(){
  const { s, g, list, inSession } = pickerFiltered(); const p = phase(picker.phaseId);
  openModal(`${sheetHead(`${ic(p.icon)} Añadir · ${esc(p.short)}`)}
    <input class="search" placeholder="Buscar ejercicio..." value="${esc(picker.q)}" oninput="picker.q=this.value;renderPickerList()">
    <div style="margin-bottom:10px">
      <label class="toggle"><input type="checkbox" ${picker.onlyPhase?'checked':''} onchange="pickerSet('onlyPhase',this.checked)">Solo ${esc(p.short.toLowerCase())}</label>
      ${g ? `<label class="toggle"><input type="checkbox" ${picker.onlyLevel?'checked':''} onchange="pickerSet('onlyLevel',this.checked)">Solo ${esc(level(g.levelId)?.name||'mi nivel')}</label>` : ''}
    </div>
    <div id="picker-list">${pickerList(list, inSession, s)}</div>`);
  const inp = document.querySelector('.sheet .search'); if (inp && picker.q) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
}
function renderPickerList(){ const { s, list, inSession } = pickerFiltered(); document.getElementById('picker-list').innerHTML = pickerList(list, inSession, s); }
function pickerList(list, inSession, s){
  if (!list.length) return empty('No hay ejercicios con estos filtros.<br><small>Quita filtros o crea uno nuevo desde el bloque.</small>','search');
  return list.map(ex => { const match = s.focus && ex.tech === s.focus && (!s.focusSub || ex.sub === s.focusSub);
    return `<div class="card" style="padding:12px">
    <div class="row">
      <div class="grow" onclick="openExercise('${ex.id}',true)">
        <div class="title">${match ? `<span style="color:var(--accent)">${ic('star','fill')}</span> ` : ''}${esc(ex.name)}</div>
        <div class="sub">${phaseTag(ex.phase)}${techTag(ex)}${levelChips(ex.levelIds, true)}</div>

let runStartOverride = {};

  if (!v.trim()) delete runStartOverride[id];

  render();
}

  const meta = document.getElementById('rc-meta'); const start = runStart(s);
  meta.className = 'meta';
  if (!start) { meta.innerHTML = `${ic('edit')} Toca para fijar la hora de inicio`; return; }
  const st = toMin(start), end = st + sessionTotal(s), slot = runSlot(s);
  const left = end - now;
  let txt, cls = '';
  if (now < st) { txt = `Empieza a las ${start} · faltan ${st-now}'`; cls = 'early'; }
  else if (left >= 0) { txt = `Fin previsto ${fromMin(end)} · quedan ${left}'`; cls = left <= 5 ? 'late' : 'ok'; }
  else { txt = `Fin previsto ${fromMin(end)} · te pasas ${-left}'`; cls = 'late'; }

  meta.className = 'meta ' + cls; meta.innerHTML = `${txt} ${ic('edit')}`;

}

/* ============================ MOCHO (marcador) ============================ */
let mochoSid = null;
function mochoInit(s){

  else if (names.length < 2) names = [...names, ...[1,2,3,4].map(i => `Pareja ${i}`)].slice(0, 4);
  const pairs = names.map(n => ({ name:n, pts:0, wins:0 }));

  save(); return m.live;
}
function openMocho(id){
  const s = byId(state.sessions, id); if (!s) return; mochoSid = id;

}

  const d = Math.abs(L.a - L.b), mx = Math.max(L.a, L.b), w = L.a > L.b ? 0 : 1;
  if (L.mode === 'p21')   return (mx >= 21 && d >= 2) ? w : null;
  if (L.mode === 'best3') return mx >= 2 ? w : null;
  if (L.mode === 'p3')    return ((mx >= 3 && d >= 2) || mx >= 5) ? w : null;
  return null;
}
function mochoPoint(side){
  const L = mLive(); if (!L || L.ended !== null) return; mSnap(L);
  if (L.mode === 'king') {
    const [k, c] = L.court;
    if (side === 0) { L.pairs[k].pts++; if (L.queue.length) { L.queue.push(c); L.court = [k, L.queue.shift()]; } }
    else { if (L.queue.length) { L.queue.push(k); L.court = [c, L.queue.shift()]; } else L.court = [c, k]; }
  } else {
    side === 0 ? L.a++ : L.b++;

  }

}

}

}

  L.pairs[i].name = n.trim(); save(); renderMocho();
}
function mochoReset(){
  const s = byId(state.sessions, mochoSid); if (!s) return;

  mochoInit(s); renderMocho();
}
function mochoClockHtml(s){

}
function renderMocho(){

    <div class="mocho-top">

      <div class="row" style="gap:4px">

/* ============================ PIZARRA ============================ */
let board = null;
const BOARD_COLORS = ['#facc15','#ffffff','#38bdf8','#f97316','#4ade80','#1e293b'];
const TOKEN_KINDS = { A:{ fill:'#2563eb', label:'A' }, B:{ fill:'#ea580c', label:'B' }, E:{ fill:'#16a34a', label:'E' }, ball:{}, cone:{} };
function boardDefault(){
  return { tool:'pen', color:BOARD_COLORS[0], horiz:false, strokes:[], cur:null, drag:null, tokens:[
    { id:uid(), kind:'A', n:1, u:.36, v:.30 }, { id:uid(), kind:'A', n:2, u:.64, v:.38 },
    { id:uid(), kind:'B', n:1, u:.36, v:.70 }, { id:uid(), kind:'B', n:2, u:.64, v:.62 },
    { id:uid(), kind:'ball', u:.5, v:.5 },
  ] };
}
function openBoard(){

  document.getElementById('board-root').innerHTML = `<div class="board">
    <div class="board-top">
      <button class="back" onclick="closeBoard()">${ic('x')} Cerrar</button>
      <span class="ttl">${ic('board')} Pizarra</span>
      <div class="row" style="gap:4px">
        <button class="icon-btn" style="background:#334155;color:#e2e8f0" title="Deshacer" onclick="boardUndo()">${ic('undo')}</button>
        <button class="icon-btn" style="background:#334155;color:#e2e8f0" title="Limpiar dibujos" onclick="boardClear()">${ic('trash')}</button>
        <button class="icon-btn" style="background:#334155;color:#e2e8f0" title="Reiniciar posiciones" onclick="boardReset()">${ic('repeat')}</button>
      </div>
    </div>
    <div class="board-wrap"><canvas id="board-cv"></canvas></div>
    <div class="board-tools" id="board-tools"></div>
  </div>`;
  renderBoardTools();
  const cv = document.getElementById('board-cv');
  cv.addEventListener('pointerdown', boardDown); cv.addEventListener('pointermove', boardMove);
  cv.addEventListener('pointerup', boardUp); cv.addEventListener('pointercancel', boardUp);
  window.addEventListener('resize', boardResize);
  requestAnimationFrame(boardResize);
}
function closeBoard(){ window.removeEventListener('resize', boardResize); document.getElementById('board-root').innerHTML = ''; }
function boardSet(k, v){ board[k] = v; renderBoardTools(); }

function boardReset(){ const { tool, color } = board; board = Object.assign(boardDefault(), { tool, color }); boardResize(); renderBoardTools(); }
function boardAdd(kind){
  const n = board.tokens.filter(t => t.kind === kind).length + 1;
  board.tokens.push({ id:uid(), kind, n, u:.5, v: kind === 'B' ? .8 : .2 }); boardDraw();
}
function renderBoardTools(){
  const tools = [['pen','edit','Lápiz'],['arrow','arrow','Flecha'],['erase','eraser','Borrar']];
  document.getElementById('board-tools').innerHTML = `
    <div class="trow">
      ${tools.map(([id,icn,lb]) => `<button class="tb ${board.tool===id?'on':''}" onclick="boardSet('tool','${id}')">${ic(icn)} ${lb}</button>`).join('')}
      <span class="sep"></span>
      ${BOARD_COLORS.map(c => `<button class="sw ${board.color===c?'on':''}" style="background:${c}" onclick="boardSet('color','${c}')"></button>`).join('')}
    </div>
    <div class="trow">
      <small style="color:#94a3b8;font-weight:700">Añadir:</small>
      <button class="tb tok" style="background:${TOKEN_KINDS.A.fill};color:#fff" onclick="boardAdd('A')">A</button>
      <button class="tb tok" style="background:${TOKEN_KINDS.B.fill};color:#fff" onclick="boardAdd('B')">B</button>
      <button class="tb tok" style="background:${TOKEN_KINDS.E.fill};color:#fff" onclick="boardAdd('E')">E</button>
      <button class="tb tok" style="background:#fde047;color:#713f12" onclick="boardAdd('ball')">${ic('ball')}</button>
      <button class="tb tok" style="background:#fed7aa;color:#c2410c" onclick="boardAdd('cone')">▲</button>
      <small style="color:#64748b;margin-left:6px">Arrastra las fichas · con <b>Borrar</b> las quitas</small>
    </div>`;
}
function boardResize(){
  const cv = document.getElementById('board-cv'); if (!cv) return;
  const wrap = cv.parentElement; const W = wrap.clientWidth - 8, H = wrap.clientHeight - 8;
  board.horiz = W > H;
  const ratio = board.horiz ? 22/14 : 14/22;
  let w = W, h = w / ratio; if (h > H) { h = H; w = h * ratio; }
  const dpr = window.devicePixelRatio || 1;

}
function boardGeom(cv){
  const dpr = window.devicePixelRatio || 1; const w = cv.width / dpr, h = cv.height / dpr;
  const P = (u, v) => board.horiz ? [v * w, (1 - u) * h] : [u * w, v * h];

function boardDraw(){
  const cv = document.getElementById('board-cv'); if (!cv || !board) return;
  const ctx = cv.getContext('2d'); const { w, h, dpr, P, R } = boardGeom(cv);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
  const rect = (u0, v0, u1, v1) => { const [x0,y0] = P(u0,v0), [x1,y1] = P(u1,v1); return [Math.min(x0,x1), Math.min(y0,y1), Math.abs(x1-x0), Math.abs(y1-y0)]; };

  ctx.fillStyle = '#dcc48f'; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#efdcaa'; ctx.fillRect(...rect(3/14, 3/22, 11/14, 19/22));
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.strokeRect(...rect(3/14, 3/22, 11/14, 19/22));
  // Red y postes
  ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 4; ctx.setLineDash([7, 4]); line(P(2.5/14, .5), P(11.5/14, .5)); ctx.setLineDash([]);
  ctx.fillStyle = '#1e293b'; [P(2.5/14, .5), P(11.5/14, .5)].forEach(([x,y]) => { ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI*2); ctx.fill(); });
  // Dibujos
  board.strokes.forEach(s => drawStroke(ctx, s, P));

function drawStroke(ctx, s, P){

    ctx.beginPath(); s.pts.forEach((p, i) => { const [x,y] = P(p[0], p[1]); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.stroke();
  } else {
    const [x0,y0] = P(...s.pts[0]), [x1,y1] = P(...s.pts[s.pts.length-1]);
    const dx = x1-x0, dy = y1-y0, len = Math.hypot(dx, dy); if (len < 6) return;
    const ang = Math.atan2(dy, dx), hl = 14;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1 - Math.cos(ang)*hl*.6, y1 - Math.sin(ang)*hl*.6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x1, y1);
    ctx.lineTo(x1 - hl*Math.cos(ang - .45), y1 - hl*Math.sin(ang - .45));
    ctx.lineTo(x1 - hl*Math.cos(ang + .45), y1 - hl*Math.sin(ang + .45)); ctx.closePath(); ctx.fill();
  }
}
function drawToken(ctx, t, P, R){
  const [x,y] = P(t.u, t.v);
  if (t.kind === 'cone') {
    ctx.fillStyle = '#f97316'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x, y - R*.8); ctx.lineTo(x + R*.7, y + R*.6); ctx.lineTo(x - R*.7, y + R*.6); ctx.closePath(); ctx.fill(); ctx.stroke();
    return;
  }
  if (t.kind === 'ball') {
    const r = R * .7;
    ctx.fillStyle = '#fde047'; ctx.strokeStyle = '#ca8a04'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x - r*.8, y - r*.3); ctx.quadraticCurveTo(x, y + r*.2, x + r*.8, y - r*.3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x - r*.5, y + r*.7); ctx.quadraticCurveTo(x, y - r*.1, x + r*.5, y + r*.7); ctx.stroke();
    return;
  }
  const k = TOKEN_KINDS[t.kind] || TOKEN_KINDS.A;
  ctx.fillStyle = k.fill; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = `800 ${Math.round(R*.95)}px -apple-system,Segoe UI,Roboto,sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(`${k.label}${t.kind === 'E' ? '' : t.n}`, x, y + 1);
}
function boardPos(e){
  const cv = e.currentTarget; const r = cv.getBoundingClientRect(); const { UV, P, R } = boardGeom(cv);
  const x = e.clientX - r.left, y = e.clientY - r.top;
  return { x, y, uv: UV(x, y), P, R };
}
function boardHit(x, y, P, R){
  for (let i = board.tokens.length - 1; i >= 0; i--) { const [tx,ty] = P(board.tokens[i].u, board.tokens[i].v); if (Math.hypot(tx-x, ty-y) <= R + 4) return board.tokens[i]; }
  return null;
}
function boardErase(x, y, P, R){
  const hit = boardHit(x, y, P, R); if (hit) { board.tokens = board.tokens.filter(t => t !== hit); return; }
  board.strokes = board.strokes.filter(s => !s.pts.some(p => { const [px,py] = P(p[0], p[1]); return Math.hypot(px-x, py-y) < 14; }));
}
function boardDown(e){
  if (board.drag || board.cur) return;
  e.preventDefault(); e.currentTarget.setPointerCapture(e.pointerId);
  const { x, y, uv, P, R } = boardPos(e);
  if (board.tool === 'erase') { board.pid = e.pointerId; board.erasing = true; boardErase(x, y, P, R); boardDraw(); return; }
  const hit = boardHit(x, y, P, R);
  if (hit) { const [tx,ty] = P(hit.u, hit.v); board.drag = { t: hit, dx: tx - x, dy: ty - y, pid: e.pointerId }; board.tokens = [...board.tokens.filter(t => t !== hit), hit]; return; }
  board.cur = { type: board.tool, color: board.color, pts: [uv], pid: e.pointerId };
}
function boardMove(e){
  const { x, y, P, R, UV } = boardPos(e);
  if (board.erasing && board.pid === e.pointerId) { boardErase(x, y, P, R); boardDraw(); return; }
  if (board.drag && board.drag.pid === e.pointerId) {
    const [u, v] = UV(x + board.drag.dx, y + board.drag.dy);
    board.drag.t.u = Math.min(1, Math.max(0, u)); board.drag.t.v = Math.min(1, Math.max(0, v)); boardDraw(); return;
  }
  if (board.cur && board.cur.pid === e.pointerId) { board.cur.pts.push(UV(x, y)); boardDraw(); }
}
function boardUp(e){
  if (board.erasing && board.pid === e.pointerId) { board.erasing = false; return; }
  if (board.drag && board.drag.pid === e.pointerId) { board.drag = null; return; }
  if (board.cur && board.cur.pid === e.pointerId) { if (board.cur.pts.length > 1) board.strokes.push(board.cur); board.cur = null; boardDraw(); }
}

      ${canShare ? `<button class="btn grow" onclick="shareData()">${ic('share')} Compartir</button>` : ''}
    </div>
    <label class="btn block" style="cursor:pointer">${ic('upload')} Importar copia<input type="file" accept="application/json,.json" style="display:none" onchange="importData(this)"></label>
  </div>

  <h2><span class="t">${ic('info')} Datos</span></h2>
  <div class="card">
    <div class="sub">${state.levels.length} niveles · ${state.groups.length} grupos · ${state.exercises.length} ejercicios · ${state.sessions.length} entrenos · ${TECH_CATS.length} gestos técnicos con ${Object.values(TECH_TREE).reduce((a,x)=>a+x.length,0)} subtipos</div>
    <button class="btn block" onclick="forceUpdate()">${ic('repeat')} Buscar actualización de la app</button>
    <button class="btn danger block" onclick="resetData()">${ic('trash')} Borrar todos los datos</button>
  </div>
  <p class="hint" style="text-align:center">Beach Coach v${APP_VERSION} · planificador de entrenos de vóley playa</p>`;
}
async function forceUpdate(){
  try {
    if ('serviceWorker' in navigator) { const regs = await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map(r => r.unregister())); }
    if (window.caches) { const keys = await caches.keys(); await Promise.all(keys.map(k => caches.delete(k))); }
  } catch(e) {}
  location.reload();
}
function exportData(){
  const blob = new Blob([JSON.stringify(state, null, 2)], { type:'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `beachcoach-${todayISO()}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
async function shareData(){
  const file = new File([JSON.stringify(state, null, 2)], `beachcoach-${todayISO()}.json`, { type:'application/json' });
  if (navigator.canShare && navigator.canShare({ files:[file] })) { try { await navigator.share({ files:[file], title:'Beach Coach · copia' }); } catch(e){} }
  else exportData();
}
function importData(input){
  const f = input.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d.levels || !d.exercises || !d.sessions) throw new Error('formato');
      if (!confirm(`Importar ${d.exercises.length} ejercicios, ${d.groups?.length||0} grupos y ${d.sessions.length} entrenos.\nEsto REEMPLAZA los datos actuales. ¿Continuar?`)) return;
      state = migrate(Object.assign(defaultState(), d)); save(); render(); alert('Datos importados correctamente.');
    } catch(e) { alert('El archivo no es una copia válida de Beach Coach.'); }
  };
  r.readAsText(f); input.value = '';
}
function resetData(){
  if (!confirm('¿Borrar TODOS los datos? Esta acción no se puede deshacer.')) return;
  if (!confirm('¿Seguro? Te recomendamos exportar antes una copia.')) return;
  state = defaultState(); save(); go('hoy');
}

/* ============================ INIT ============================ */
render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js', { updateViaCache:'none' }).then(reg => { try { reg.update(); } catch(e){} }).catch(() => {});
  // Cuando entra una versión nueva de la app, recarga una vez para mostrarla.
  let hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController) location.reload(); hadController = true; });
}
</script>
</body>
</html>
